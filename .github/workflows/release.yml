name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (for example v1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build onefile executable
        shell: cmd
        run: build.bat --no-pause

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $file = "dist/ZapretRU.exe"
          if (-not (Test-Path $file)) { throw "Build did not produce $file" }
          $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ZapretRU.exe" | Set-Content -Path "dist/SHA256SUMS.txt" -Encoding ascii
          Get-Content "dist/SHA256SUMS.txt"

      - name: Publish GitHub Release
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if (-not $tag) { throw "Release tag is empty" }
          $existing = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "dist/ZapretRU.exe" "dist/SHA256SUMS.txt" --clobber
          } else {
            gh release create $tag "dist/ZapretRU.exe" "dist/SHA256SUMS.txt" `
              --title "Zapret RU $tag" `
              --generate-notes `
              --notes "Windows launcher for original bol-van/zapret. No zapret binaries are bundled; put official bin/ files next to ZapretRU.exe. Verify SHA256SUMS.txt before running."
          }
