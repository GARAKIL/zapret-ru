name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (for example v2.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build onefile executable
        shell: cmd
        run: build.bat --no-pause

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $file = "dist/ZapretRU.exe"
          if (-not (Test-Path $file)) { throw "Build did not produce $file" }
          $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ZapretRU.exe" | Set-Content -Path "dist/SHA256SUMS.txt" -Encoding ascii
          Get-Content "dist/SHA256SUMS.txt"

      - name: Publish GitHub Release
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if (-not $tag) { throw "Release tag is empty" }
          $assets = @(
            "dist/ZapretRU.exe",
            "dist/SHA256SUMS.txt",
            "dist/THIRD_PARTY_NOTICES.txt",
            "dist/THIRD_PARTY_LICENSES.zip"
          ) | Where-Object { Test-Path $_ }
          $existing = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            $notesFile = "docs/RELEASE_$($tag.TrimStart('v')).md"
            if (Test-Path $notesFile) {
              gh release create $tag @assets `
                --title "Zapret RU $tag" `
                --notes-file $notesFile
            } else {
              gh release create $tag @assets `
                --title "Zapret RU $tag" `
                --generate-notes `
                --notes "Self-contained Windows DPI bypass with a built-in WinDivert engine. No winws.exe, no zapret binaries. Verify SHA256SUMS.txt and read THIRD_PARTY_NOTICES.txt before running."
            }
          }
