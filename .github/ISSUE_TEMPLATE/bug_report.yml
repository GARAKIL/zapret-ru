name: Bug report
description: Сообщить о проблеме в Zapret RU
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Не прикладывайте пароли, токены и персональные данные.
        Проверьте `launcher.log` и приложите последние строки вкладки «Журнал».
  - type: input
    id: version
    attributes:
      label: Версия Zapret RU
      placeholder: 1.2.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows и архитектура
      placeholder: Windows 11 23H2 x64
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Провайдер / тип подключения
      placeholder: Ростелеком, домашний Ethernet
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Режим
      options:
        - Все программы
        - По списку
        - Все программы + QUIC → TCP
        - По списку + QUIC → TCP
    validations:
      required: true
  - type: input
    id: preset
    attributes:
      label: Профиль
      placeholder: Умный / Быстрый / Ровный / Глубокий / Без QUIC-фильтра
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      placeholder: |
        1. Запустил ZapretRU.exe ...
        2. Включил защиту ...
        3. Открыл ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Логи (без личных данных)
      render: text
      description: Вставьте последние строки вкладки «Журнал» или launcher.log.
  - type: checkboxes
    id: checks
    attributes:
      label: Проверки
      options:
        - label: Я проверил последнюю версию из Releases и контрольную сумму SHA-256
          required: true
        - label: Я использую официальный релиз Zapret RU, а не стороннюю пересборку
          required: true
        - label: В логах нет паролей, токенов и персональных данных
          required: true
